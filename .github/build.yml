name: Build LabTools Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Publish Single-File Executable
      run: dotnet publish LabTools.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabTools-Executable
        path: publish/LabTools.exe
